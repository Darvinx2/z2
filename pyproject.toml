[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-file-manager"
version = "1.0.0"
description = "Файловый менеджер с журналированием в базе данных (Практика 1)"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.scripts]
file-manager = "app.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/cli/*"]
